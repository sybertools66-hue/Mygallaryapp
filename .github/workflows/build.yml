name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Find and Build
      run: |
        # gradlew ෆයිල් එක තියෙන තැන හොයාගෙන බිල්ඩ් කිරීම
        if [ -f "./gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug
        elif [ -f "./Mygallaryapp/gradlew" ]; then
          cd Mygallaryapp
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          # වෙනත් ෆෝල්ඩරයක ඇත්නම් සොයා බලයි
          find . -name "gradlew" -exec chmod +x {} \;
          DIR=$(find . -name "gradlew" -exec dirname {} \; | head -n 1)
          if [ -n "$DIR" ]; then
            cd "$DIR"
            ./gradlew assembleDebug
          else
            echo "Gradlew file not found!"
            exit 1
          fi
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/build/outputs/apk/debug/app-debug.apk'
