name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Create basic Gradle structure
      run: |
        echo "include ':app'" > settings.gradle
        mkdir -p app/src/main/java
        echo "apply plugin: 'com.android.application'" > app/build.gradle
        echo "android { compileSdk 34 }" >> app/build.gradle

    - name: List files
      run: find . -maxdepth 3
